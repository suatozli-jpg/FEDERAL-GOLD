# Pages CMS configuration — https://pagescms.org
# Manage the "Vitrin" products from https://app.pagescms.org (or federalgold.org/admin).

media:
  input: assets/products
  output: /assets/products
  rename: random
  categories: [image]

content:
  - name: products
    label: Vitrin Ürünleri
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Ürün adı
        type: string
        required: true
      - name: nameEn
        label: İngilizce ad (isteğe bağlı, site EN'deyken görünür)
        type: string
      - name: image
        label: Fotoğraf
        type: image
        required: true
      - name: category
        label: Kategori
        type: select
        required: true
        options:
          values:
            - name: bracelets
              label: Bilezik
            - name: rings
              label: Yüzük
            - name: necklaces
              label: Kolye
            - name: earrings
              label: Küpe
            - name: watches
              label: Saat
            - name: other
              label: Diğer
      - name: karat
        label: Ayar
        type: select
        options:
          placeholder: Seçiniz (isteğe bağlı)
          values: ["8", "14", "18", "21", "22", "24"]
      - name: weight
        label: Gram (örn. 20,5)
        type: string
      - name: price
        label: Fiyat ₺ (boş bırakılırsa sitede görünmez)
        type: number
      - name: isNew
        label: "\"Yeni\" etiketi göster"
        type: boolean
