<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a09">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | Federal Gold Kuyumculuk</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&display=swap">
  <style>
    :root { --bg: #0b0a09; --gold: #d9b062; --gold-light: #f0d59a; --gold-ink: #1a1307; --text: #f5f0e6; --muted: #b9b0a2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--text); font: 16px/1.6 'Manrope', -apple-system, 'Segoe UI', Arial, sans-serif; text-align: center; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; border-radius: 8px; }
    main { max-width: 520px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--gold); font: 600 24px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: .06em; }
    .brand svg { width: 40px; height: 34px; }
    .code { margin: 48px 0 0; font: 500 120px/1 'Cormorant Garamond', Georgia, serif; color: var(--gold-light); }
    h1 { margin: 8px 0 12px; font: 500 34px/1.2 'Cormorant Garamond', Georgia, serif; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 24px; border-radius: 10px; font-weight: 600; font-size: 15px; border: 1px solid var(--gold); }
    .btn-primary { background: var(--gold); color: var(--gold-ink); }
    .btn-primary:hover { background: #e6c178; }
    .btn-outline:hover { background: #241c10; }
    .en { margin-top: 28px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Federal Gold — Ana Sayfa">
      <svg viewBox="0 0 70 60" aria-hidden="true"><path d="M5 18 18 4h34l13 14-30 35L5 18Zm0 0h60M18 4l10 14 7 35 7-35L52 4M28 18h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>
      FEDERAL GOLD
    </a>
    <p class="code" aria-hidden="true">404</p>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönebilir ya da bize WhatsApp’tan yazabilirsiniz.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ana Sayfaya Dön</a>
      <a class="btn btn-outline" href="https://wa.me/905423905967" target="_blank" rel="noopener noreferrer">WhatsApp ile Yazın</a>
    </div>
    <p class="en" lang="en">Page not found. <a href="/" style="color: var(--gold-light); text-decoration: underline; text-underline-offset: 3px;">Go to the homepage</a></p>
  </main>
</body>
</html>
