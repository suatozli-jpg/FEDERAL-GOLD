            label: İletişim bilgileri
            widget: object
            collapsed: true
            summary: "Telefonlar, WhatsApp, e-posta, Instagram"
            fields:
              - { name: magazaTel, label: "Kapalıçarşı mağaza telefonu", widget: string, hint: "Örnek: +90 212 511 74 28" }
              - { name: whatsapp, label: "Kapalıçarşı cep · WhatsApp", widget: string, hint: "Sitedeki tüm WhatsApp butonları bu numaraya gider" }
              - { name: semdinliTel, label: "Şemdinli telefonu (WhatsApp)", widget: string }
              - { name: vanTel, label: "Van telefonu (WhatsApp)", widget: string }
              - { name: eposta, label: "E-posta", widget: string }
              - { name: instagram, label: "Instagram (Kapalıçarşı)", widget: string, hint: "@ işareti olmadan" }
